<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% seo %}
</head>
<body>
<header class="site-header">
  <div class="container nav-wrap">
    <a class="brand" href="{{ '/' | relative_url }}">
      <span class="brand-mark">R</span>
      <span>{{ site.title }}</span>
    </a>
    <nav>
      <a href="{{ '/' | relative_url }}">Home</a>
      <a href="{{ '/projects/' | relative_url }}">Projects</a>
      <a href="{{ '/people/' | relative_url }}">Team</a>
      <a href="{{ '/publications/' | relative_url }}">Publications</a>
      <a href="{{ '/deadlines/' | relative_url }}">Deadlines</a>
      <a href="{{ '/resources/' | relative_url }}">Resources</a>
    </nav>
  </div>
</header>

<main class="container page-content">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="container footer-grid">
    <div>
      <strong>{{ site.title }}</strong>
      <p>Research • One Health • Veterinary Science • Data</p>
    </div>
    <div class="footer-right">
      <p>© {{ 'now' | date: "%Y" }} {{ site.title }}</p>
      <p>Powered by GitHub Pages</p>
    </div>
  </div>
</footer>
</body>
</html>
